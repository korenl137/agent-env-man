# Copy this inventory to a location you own and replace the example repositories.
version = 2

# These defaults apply to all skills. Hooks/schedulers must call aem auto.
[updates.defaults]
trigger = []
# Opt in with ["shell-start", "agent-start"] or ["interval"].
action = "sync"
min_interval = 600
timeout = 30

[updates.policies.observe]
action = "check"

[sources.research-tools]
type = "git"
repository = "https://github.com/OWNER/RESEARCH-TOOLS.git"

[skills.report-helper]
source = "research-tools"
subdir = "skills/report-helper"

[skills.second-helper]
source = "research-tools"
subdir = "skills/second-helper"

[sources.standalone]
type = "git"
repository = "git@github.com:OWNER/STANDALONE-SKILL.git"

[skills.standalone-skill]
source = "standalone"
# subdir defaults to "."; branch defaults to the remote's default branch.

# An optional named policy plus explicit per-skill overrides:
# [skills.report-helper.update]
# policy = "observe"
# trigger = ["agent-start"]
# min_interval = 3600
