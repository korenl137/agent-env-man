version = 2

[sources.tools]
type = "git"
repository = "https://github.com/OWNER/TOOLS.git"

[skills.report]
source = "tools"
subdir = "skills/report"

[skills.report.install]
mode = "link"

# External paths belong in machine.toml, never in this shared declaration.
[sources.personal-documents]
type = "external"

[instructions.personal]
source = "personal-documents"
subdir = "guidance"
entry = "start.md"

[instructions.personal.install.bundle]
destination = "personal"

[instructions.personal.install.entry]
root = "agent"
destination = "AGENTS.md"

# For a Git bundle, set source = "tools" (or another named Git source).
# No source-local manifest or fixed document layout is required.
